<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ACE Talent Consulting | Recruitment, Staffing & Workforce Solutions</title>

  <meta
    name="description"
    content="ACE Talent Consulting connects exceptional talent with exceptional opportunities. Permanent recruitment, contract staffing, executive search and workforce solutions across India."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header id="hd">

    <!-- Thin Blue/Navy Top Line -->
    <div class="top-line"></div>

    <div class="w hb">

      <!-- LOGO -->
      <a
        href="#/"
        class="logo"
        aria-label="ACE Talent Consulting home"
      >
        <b>ACE</b> TALENT
        <small>CONSULTING</small>
      </a>


      <!-- NAVIGATION -->
      <nav id="nv" aria-label="Main">

        <ul>

          <!-- HOME -->
          <li>
            <a class="t" href="#/">
              Home
            </a>
          </li>


          <!-- ABOUT -->
          <li>
            <a class="t" href="#/about">
              About Us
            </a>
          </li>


          <!-- SERVICES -->
          <li class="dd">

            <a class="t" href="#/services">
              Services ▾
            </a>

            <div
              class="menu"
              id="mS"
            ></div>

          </li>


          <!-- INDUSTRIES -->
          <li class="dd">

            <a class="t" href="#/industries">
              Industries ▾
            </a>

            <div
              class="menu"
              id="mI"
            ></div>

          </li>


          <!-- CAREERS -->
          <li>
            <a class="t" href="#/careers">
              Careers
            </a>
          </li>


          <!-- FIND A JOB -->
          <li>
            <a class="t" href="#/jobs">
              Find a Job
            </a>
          </li>

        </ul>

      </nav>


      <!-- RIGHT SIDE BUTTONS -->
      <div class="ha">

        <!-- HIRE TALENT -->
        <a
          class="btn b1"
          href="#/employers"
        >
          Hire Talent
        </a>


        <!-- CONTACT US -->
        <a
          class="btn contact-btn"
          href="#/contact"
        >
          Contact Us
        </a>


        <!-- MOBILE MENU -->
        <button
          class="bg"
          id="bg"
          aria-label="Open menu"
          aria-expanded="false"
        >
          ☰
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN APP
       ========================= -->

  <main id="app"></main>


  <!-- =========================
       FOOTER
       ========================= -->

  <footer>

    <div class="w">

      <div
        class="fc"
        id="ft"
      ></div>


      <div class="fb">

        <span>
          © 2026 ACE TALENT CONSULTING. All Rights Reserved.
        </span>


        <span>

          <a
            style="display:inline"
            href="#/privacy"
          >
            Privacy Policy
          </a>

          &nbsp;·&nbsp;

          <a
            style="display:inline"
            href="#/terms"
          >
            Terms &amp; Conditions
          </a>

        </span>

      </div>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT FILES
       ========================= -->

  <script src="js/data.js"></script>

  <script src="js/forms.js"></script>

  <script src="js/pages.js"></script>

  <script src="js/app.js"></script>


  <!-- =========================
       HEADER EXTRA STYLING
       ========================= -->

  <style>

    /* TOP BLUE LINE */
    #hd .top-line {
      width: 100%;
      height: 7px;

      background: linear-gradient(
        90deg,
        #0a1a3f 0%,
        #1f5bff 50%,
        #0a1a3f 100%
      );
    }


    /* HEADER BUTTON AREA */
    #hd .ha {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    /* CONTACT BUTTON */
    #hd .contact-btn {
      background: #0a1a3f;
      color: #ffffff;
      border: 2px solid #0a1a3f;
    }


    #hd .contact-btn:hover {
      background: #1f5bff;
      border-color: #1f5bff;
      color: #ffffff;
    }


    /* BUTTON SIZE */
    #hd .ha .btn {
      min-height: 42px;
      padding: 0 17px;
      font-size: 0.88rem;
    }


    /* MOBILE */
    @media (max-width: 980px) {

      #hd .contact-btn {
        display: none;
      }

    }

  </style>

</body>

</html>
